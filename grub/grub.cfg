# BPI-R4 (MT7988A) -- VyOS arm64 boot menu
#
# Two board-specific fixes are applied to every entry:
#  1. console: the ISO's own grub.cfg says console=ttyAMA0 (ARM PL011). The
#     MT7988 UART is 8250-compatible at 0x11000000, i.e. ttyS0. Using ttyAMA0
#     gives a silent hang.
#  2. devicetree: the default entries keep the tree EDK2 installs. EDK2 picks
#     the -sd or -emmc variant for the medium it booted from and adds the
#     MAC addresses from the EEPROM. GRUB's "devicetree" replaces that tree
#     and loses the MACs, so only the installer and override entries use it.

# The firmware (EDK2 or U-Boot) already puts the EFI console on the UART.
# GRUB's own serial terminal does not exist on arm64-efi ("com0" is an x86
# name; the EFI port is "efi0"), so "serial"/"terminal serial" only errored.
terminal_input console
terminal_output console

set timeout=15
set default=0

set kver=6.18.50-vyos
set dtb_sd=/dtb/mt7988a-bananapi-bpi-r4-sd.dtb
set dtb_emmc=/dtb/mt7988a-bananapi-bpi-r4-emmc.dtb
set earlycon="earlycon=uart8250,mmio32,0x11000000"
# ttyS0 must come LAST: the last console= becomes /dev/console, and that is
# where systemd-getty-generator starts a login. VyOS's default config has no
# "system console", so nothing else would put a getty on the UART.
set console="console=tty0 console=ttyS0,115200"
set common="boot=live components hostname=vyos username=live nopersistence noautologin nonetworking union=overlay net.ifnames=0 biosdevname=0"

menuentry "VyOS live (SD)" {
    linux  /live/vmlinuz-${kver} ${common} live-media-path=/live ${console} ${earlycon}
    initrd /live/initrd.img-${kver}
}

menuentry "VyOS live - verbose (ignore_loglevel, initcall_debug)" {
    linux  /live/vmlinuz-${kver} ${common} live-media-path=/live ${console} ${earlycon} \
           ignore_loglevel debug loglevel=8 initcall_debug
    initrd /live/initrd.img-${kver}
}

# The eMMC DTB moves MSDC0 from the SD slot to the eMMC: /dev/mmcblk0 becomes
# the eMMC, ready for "install image". Linux then cannot see the SD card, so
# the live system comes from the same VyOS ISO stored as ${usb_iso} on a USB
# stick; toram lets the stick go once booted. No EEPROM MACs in this entry.
set usb_iso=/vyos.iso
menuentry "VyOS live from USB stick, eMMC visible (installer)" {
    devicetree ${dtb_emmc}
    linux  /live/vmlinuz-${kver} ${common} findiso=${usb_iso} toram ${console} ${earlycon}
    initrd /live/initrd.img-${kver}
}

menuentry "VyOS live - SD device tree from the ESP (no EEPROM MACs)" {
    devicetree ${dtb_sd}
    linux  /live/vmlinuz-${kver} ${common} live-media-path=/live ${console} ${earlycon}
    initrd /live/initrd.img-${kver}
}

menuentry "VyOS live (loopback from /vyos.iso)" {
    if [ -f /vyos.iso ]; then
        loopback lo /vyos.iso
        linux  (lo)/live/vmlinuz-${kver} ${common} findiso=/vyos.iso ${console} ${earlycon}
        initrd (lo)/live/initrd.img-${kver}
    else
        echo "No /vyos.iso on the ESP."; sleep 10
    fi
}

menuentry "UEFI Shell" { chainloader /EFI/tools/Shell.efi }

# xHCI PORTSC 1/2, IPPC PW_STS1/U3_CTRL0/U2_CTRL0, T-PHY U2 DTM0/DTM1
menuentry "Debug: USB controller registers" {
    for a in 0x11200420 0x11200430 0x11203e10 0x11203e30 0x11203e50 0x11c50368 0x11c5036c; do
        read_dword $a -v v
        echo "$a = $v"
    done
    echo "Press a key"; read
}

menuentry "List ESP contents" { ls -l /; ls -l /live/; ls -l /dtb/; sleep 20 }
menuentry "GRUB command line" { normal_exit }
menuentry "Reboot" { reboot }
