# BPI-R4 USB stick: boots the VyOS ISO stored on this FAT partition.
# No "devicetree": EDK2 installs the DTB for its boot medium (SPI-NAND and
# eMMC boots get the -emmc tree, so the eMMC is visible for "install image")
# with the EEPROM MAC addresses.
terminal_input console
terminal_output console

set timeout=10
set default=0

set iso=/vyos-2026.11.02-1213-bpi-R4-generic-arm64.iso
set kver=6.18.60-vyos
set earlycon="earlycon=uart8250,mmio32,0x11000000"
set console="console=tty0 console=ttyS0,115200"
set common="boot=live components hostname=vyos username=live nopersistence noautologin nonetworking union=overlay net.ifnames=0 biosdevname=0"

menuentry "VyOS live from USB (ISO in RAM)" {
    loopback lo ${iso}
    linux  (lo)/live/vmlinuz-${kver} ${common} findiso=${iso} toram ${console} ${earlycon}
    initrd (lo)/live/initrd.img-${kver}
}

# One-off: SD device tree without "read-only" on the NAND bl2 partition, so
# tools/flash-nand.sh can write it. No EEPROM MACs in this entry.
menuentry "VyOS live from USB, NAND bl2 writable (firmware update)" {
    devicetree /bpi-r4/mt7988a-bananapi-bpi-r4-sd-nandrw.dtb
    loopback lo ${iso}
    linux  (lo)/live/vmlinuz-${kver} ${common} findiso=${iso} toram ${console} ${earlycon}
    initrd (lo)/live/initrd.img-${kver}
}

menuentry "List USB stick" { ls -l /; sleep 20 }
menuentry "Reboot" { reboot }
